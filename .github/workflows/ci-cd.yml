name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend lint & static security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt pip-audit detect-secrets
      - name: Ruff Lint & Bandit Security (S rules)
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy apps config
      - name: Secret Scan
        run: detect-secrets scan --baseline ../.secrets.baseline
        working-directory: .
      - name: Python Dependency Audit
        run: pip-audit -r requirements/base.txt

  backend-tests:
    name: Backend tests
    needs: backend-lint
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Pytest with coverage
        run: pytest apps/ --cov=apps --cov-report=xml --cov-fail-under=80 -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Upload coverage report
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

  frontend-lint:
    name: Frontend lint & dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run type-check
      - name: Prettier
        run: npm run format:check
      - name: Npm Audit
        run: npm audit --audit-level=high --omit=dev

  frontend-tests:
    name: Frontend tests
    needs: frontend-lint
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Jest with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Upload coverage report
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

  backend-smoke:
    name: Backend smoke
    if: false  # local-only for now; needs live stack when enabled
    needs: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Live health smoke
        run: pytest -m smoke -v -o addopts=

  frontend-e2e:
    name: Frontend smoke
    if: false  # local-only for now
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
